name: Guardian Review (reusable)

# Called by a repository's own guardian.yml on `/guardian review` (#739):
#
#   jobs:
#     review:
#       if: github.event.issue.pull_request != null && github.event.comment.body == '/guardian review'
#       uses: zaebee/codegraph-brain/.github/workflows/guardian-reusable.yml@<sha>
#       with:
#         pr_number: ${{ github.event.issue.number }}
#         tooling_ref: <the same sha>
#         source_root: src
#       secrets:
#         ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
#         GUARDIAN_APP_PRIVATE_KEY: ${{ secrets.GUARDIAN_APP_PRIVATE_KEY }}
#       permissions: {contents: read, pull-requests: write, issues: write, id-token: write}
#
# `secrets: inherit` reaches a called workflow only within one organisation or
# enterprise; any other caller passes the secrets declared below by name.
# Variables are always the caller's: GUARDIAN_PROVIDER, GUARDIAN_MODEL,
# GUARDIAN_OPENCODE_EFFORT, GUARDIAN_FEATURES, GUARDIAN_SKEPTIC,
# GUARDIAN_SKEPTIC_MODEL, OPENCODE_CLIENT_ID, GUARDIAN_APP_CLIENT_ID.
#
# The opencode-go finder needs no static key: the job exchanges a GitHub OIDC
# token for a short-lived inference token immediately before the review (#775).
# The caller grants `id-token: write` and sets its own OPENCODE_CLIENT_ID
# variable, and OIDC access must be enabled for GitHub Actions in the Opencode
# console. The workflow declares no OPENCODE_API_KEY secret, and the review
# step must not set that variable: a step-level value overrides GITHUB_ENV and
# would discard the minted token.
#
# The caller's Actions policy must allow this workflow and the actions it uses
# (actions/*, astral-sh/setup-uv, peter-evans/create-or-update-comment).
# Pin `uses:` and `tooling_ref` to the SAME commit SHA, never a tag: the
# tooling runs on the caller's runner, and a tag can move.
#
# The pins are current majors and run on node24, so a self-hosted runner must
# be v2.327.1 or later (GitHub-hosted runners already are). The job needs no
# GitHub CLI: the reaction and the base-branch lookup are
# actions/github-script, and the poster talks to the REST API over HTTPS (#742).

on:
  workflow_call:
    inputs:
      pr_number:
        description: The pull request to review.
        type: number
        required: true
      tooling_ref:
        description: >-
          The zaebee/codegraph-brain commit whose tooling runs. Pass the same ref
          the caller's `uses:` names, so the job and its scripts agree.
        type: string
        required: true
      source_root:
        description: The directory inside the reviewed repository to build the graph from.
        type: string
        default: src
      runner:
        description: The job's runs-on, as JSON (a self-hosted label list works).
        type: string
        default: '["ubuntu-latest"]'
      save_metrics:
        description: >-
          Restore guardian_metrics.jsonl from codegraph-brain's own data/guardian-metrics
          branch. For codegraph-brain's caller only; any other caller leaves it false.
        type: boolean
        default: false
    secrets:
      # `ANTHROPIC_API_KEY` stays declared and passed so existing callers keep
      # working; opencode-go does not require it. There is deliberately no
      # OPENCODE_API_KEY secret: the token is minted from GitHub OIDC below.
      ANTHROPIC_API_KEY:
        required: false
      GEMINI_API_KEY:
        required: false
      MISTRAL_API_KEY:
        required: false
      GUARDIAN_APP_PRIVATE_KEY:
        required: false

permissions: {}

jobs:
  review:
    runs-on: ${{ fromJSON(inputs.runner) }}
    # Below the app token's one-hour lifetime (#734): a review cannot outlive
    # the token it posts with.
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
      issues: write
      # Required to request the OIDC token the OpenCode sign-in exchanges
      # (#775). A reusable workflow cannot ask for more than the caller grants.
      id-token: write

    steps:
      # Here rather than in each caller, so no caller can forget it.
      - name: Check commenter has write access
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.payload.comment.user.login,
            });
            const allowed = ['admin', 'write'];
            if (!allowed.includes(perm.permission)) {
              core.setFailed(`@${context.payload.comment.user.login} needs write access to trigger Guardian Review (has: ${perm.permission})`);
            }

      - name: React to trigger comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          # The comment the caller's `if` matched: `context.payload.comment`.
          # The REST call, not `gh api` — a self-hosted runner need not have gh (#742).
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes',
            });

      - name: Validate inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ inputs.pr_number }}
          SOURCE_ROOT: ${{ inputs.source_root }}
        run: |
          if [ "$EVENT_NAME" != issue_comment ]; then
            echo "Call this on issue_comment (a /guardian review comment), not $EVENT_NAME" && exit 1
          fi
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Invalid PR number: $PR_NUMBER" && exit 1
          fi
          # The same rule as guardian_review.py: `..` only as a path component,
          # no absolute path, drive, backslash or whitespace.
          case "$SOURCE_ROOT" in /*) SOURCE_ROOT_BAD=1 ;; esac
          case "/$SOURCE_ROOT/" in
            */../*|*\\*|*:*|*[[:space:]]*) SOURCE_ROOT_BAD=1 ;;
          esac
          case "${SOURCE_ROOT_BAD:-}" in
            1)
              echo "source_root must be a plain path inside the repository: '$SOURCE_ROOT'" && exit 1 ;;
          esac
          echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_ENV

      # Read through the REST API, not `gh pr view`: gh is not on every runner
      # (#742). PR_NUMBER was validated as digits-only in the step above, so
      # the number cannot reach the API malformed.
      - name: Get base branch
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PR_NUMBER),
            });
            core.exportVariable('BASE_BRANCH', pr.base.ref);

      # The PR is data, never code (#730). Everything that runs — uv sync, the
      # guardian scripts, cgis itself — comes from codegraph-brain at
      # tooling_ref, checked out here; the PR lands in pr/ and is only diffed,
      # read and parsed. This step and the next keep the job's provider keys
      # out of reach of whoever wrote the PR.
      - name: Checkout trusted tooling (codegraph-brain)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          repository: zaebee/codegraph-brain
          ref: ${{ inputs.tooling_ref }}
          persist-credentials: false

      # tooling_ref must name the commit the caller's `uses:` does: the steps
      # here and the scripts they run then agree. An older checkout fails here,
      # before any spend, instead of on an unknown flag.
      - name: Check the tooling matches this workflow
        run: |
          grep -q -- '"--source-root"' scripts/guardian_review.py || {
            echo "tooling_ref predates this workflow: pin uses: and tooling_ref to the same SHA" && exit 1
          }

      - name: Checkout PR branch as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          repository: ${{ github.repository }}
          # PR_NUMBER validated as digits-only in a previous step
          ref: refs/pull/${{ env.PR_NUMBER }}/head
          path: pr
          fetch-depth: 0
          persist-credentials: false

      # The caller's GITHUB_TOKEN, passed for this one command through git's
      # environment config (not argv, which other processes on a self-hosted
      # runner can read) and never stored in pr/.git/config. Masked as
      # actions/checkout masks it. A private repository needs it; a public one
      # ignores it.
      - name: Fetch base branch for diff
        working-directory: pr
        env:
          FETCH_TOKEN: ${{ github.token }}
        run: |
          cred=$(printf 'x-access-token:%s' "$FETCH_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$cred"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $cred" git fetch origin "$BASE_BRANCH"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      - name: Install dependencies
        run: uv sync --frozen --extra guardian

      # diff_check (#733) reads data keys, which the graph has only when
      # ingested with --data-keys; without the feature the graph is as before.
      - name: Build code graph
        env:
          GUARDIAN_FEATURES: ${{ vars.GUARDIAN_FEATURES }}
          SOURCE_ROOT: ${{ inputs.source_root }}
        run: |
          flags=""
          # Same reading as parse_features: comma-separated, any whitespace ignored.
          case ",$(printf '%s' "$GUARDIAN_FEATURES" | tr -d '[:space:]')," in
            *,diff_check,*) flags="--data-keys" ;;
          esac
          uv run --frozen cgis ingest "pr/$SOURCE_ROOT" --output graph.db $flags

      # Fetches anonymously: the tooling checkout keeps no credentials (#730),
      # and the metrics branch is codegraph-brain's own. Off for other callers.
      - name: Restore metrics from data branch
        if: inputs.save_metrics
        run: |
          git fetch origin data/guardian-metrics 2>/dev/null && \
            git show origin/data/guardian-metrics:guardian_metrics.jsonl \
              > guardian_metrics.jsonl 2>/dev/null || true

      # Post as the codegraph-brain GitHub App when it is configured (#734):
      # set vars.GUARDIAN_APP_CLIENT_ID and secrets.GUARDIAN_APP_PRIVATE_KEY.
      # With the variable unset this step is skipped and posting uses
      # GITHUB_TOKEN, as before. With it set, a missing key, a wrong key or an
      # app not installed here fails the job before any LLM call: no silent
      # fallback to another identity. The app's key reaches every repository
      # the app is installed on, so the token is narrowed to this one and to
      # pull-requests: write. Two steps read it, both of which post: "Run
      # Guardian Review", which posts the inline review itself, and the fallback
      # comment. Both run only this repository's tooling, never PR code. It
      # lives one hour; the job's timeout-minutes keeps the review inside that.
      - name: Mint GitHub App token
        id: app-token
        if: vars.GUARDIAN_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ vars.GUARDIAN_APP_CLIENT_ID }}
          private-key: ${{ secrets.GUARDIAN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write

      # Minted immediately before the review and only after every step that
      # touches the PR checkout, exactly like the App token above (#730, #775):
      # the token is short-lived and the code it reviews never sees it. The
      # value goes to GITHUB_ENV, which the review step inherits.
      - name: Sign in to OpenCode (OIDC)
        if: vars.OPENCODE_CLIENT_ID != ''
        env:
          AUDIENCE: https://opencode.ai/console
          CLIENT_ID: ${{ vars.OPENCODE_CLIENT_ID }}
        run: |
          set -euo pipefail
          # No jq: a self-hosted runner may not have it, the same reason #742
          # removed the GitHub CLI dependency. python3 runs the tests, so it
          # is there.
          missing=""
          [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || missing="$missing ACTIONS_ID_TOKEN_REQUEST_URL"
          [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ] || missing="$missing ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::GitHub OIDC is unavailable:$missing. Grant id-token: write to this job and to the caller's job."
            exit 1
          fi

          oidc_response=$(curl -sS -w '\n%{http_code}' \
            --oauth2-bearer "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE")
          oidc_status=$(printf '%s' "$oidc_response" | tail -n1)
          oidc_body=$(printf '%s' "$oidc_response" | sed '$d')
          if [ "$oidc_status" -lt 200 ] || [ "$oidc_status" -ge 300 ]; then
            # The OIDC response is not printed: it carries a JWT.
            echo "::error::GitHub OIDC token request failed with HTTP $oidc_status."
            exit 1
          fi
          oidc=$(printf '%s' "$oidc_body" | python3 -c 'import json, sys; print(json.load(sys.stdin)["value"])') || {
            echo "::error::GitHub OIDC response carried no value field."
            exit 1
          }

          token_response=$(curl -sS -w '\n%{http_code}' \
            https://opencode.ai/console/auth/oauth/token \
            -d grant_type=urn:ietf:params:oauth:grant-type:token-exchange \
            -d subject_token_type=urn:ietf:params:oauth:token-type:jwt \
            -d client_id="$CLIENT_ID" \
            -d subject_token="$oidc")
          token_status=$(printf '%s' "$token_response" | tail -n1)
          token_body=$(printf '%s' "$token_response" | sed '$d')
          if [ "$token_status" -lt 200 ] || [ "$token_status" -ge 300 ]; then
            echo "::error::OpenCode token exchange failed with HTTP $token_status: ${token_body:0:400}"
            exit 1
          fi
          token=$(printf '%s' "$token_body" | python3 -c 'import json, sys; print(json.load(sys.stdin)["access_token"])') || {
            echo "::error::OpenCode token exchange returned no access_token."
            exit 1
          }
          if [ -z "$token" ]; then
            echo "::error::OpenCode token exchange returned an empty access_token."
            exit 1
          fi
          echo "::add-mask::$token"
          echo "OPENCODE_API_KEY=$token" >> "$GITHUB_ENV"

      - name: Run Guardian Review
        id: guardian
        env:
          # OPENCODE_API_KEY is deliberately absent: the OIDC step above
          # writes it to GITHUB_ENV, and a step-level value would override it.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GUARDIAN_PROVIDER: ${{ vars.GUARDIAN_PROVIDER }}
          GUARDIAN_MODEL: ${{ vars.GUARDIAN_MODEL }}
          # Reasoning depth for an opencode-go finder; unset = the provider's
          # default ("low"). A bad value fails at the gateway, loudly.
          GUARDIAN_OPENCODE_EFFORT: ${{ vars.GUARDIAN_OPENCODE_EFFORT }}
          # Anthropic stays selectable but is no longer the default finder, so
          # GUARDIAN_ANTHROPIC_EFFORT is deliberately not passed here; an
          # explicit anthropic pick runs at the provider's own default (#775).
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GUARDIAN_FEATURES: ${{ vars.GUARDIAN_FEATURES }}
          GUARDIAN_SKEPTIC: ${{ vars.GUARDIAN_SKEPTIC }}
          GUARDIAN_SKEPTIC_MODEL: ${{ vars.GUARDIAN_SKEPTIC_MODEL }}
          SOURCE_ROOT: ${{ inputs.source_root }}
          # GUARDIAN_EVIDENCE (#401) is deliberately not passed: the evidence
          # pass runs `uv run pyrefly/ruff` inside the reviewed checkout, which is
          # the PR, while this step holds the provider keys (#730).
          # guardian_review.py refuses that combination with --repo-root.
        run: |
          uv run --frozen python scripts/guardian_review.py \
            --output guardian_report.md \
            --db graph.db \
            --pr "$PR_NUMBER" \
            --metrics guardian_metrics.jsonl \
            --record-finder guardian_finder.json \
            --inline \
            --repo-root pr \
            --source-root "$SOURCE_ROOT" \
            --base-branch "$BASE_BRANCH"

      - name: Upload metrics artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: guardian-metrics-${{ env.PR_NUMBER }}
          path: guardian_metrics.jsonl
          retention-days: 7

      - name: Upload finder recording artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: guardian-finder-${{ env.PR_NUMBER }}
          path: guardian_finder.json
          retention-days: 7

      - name: Post review as PR comment
        if: steps.guardian.outputs.posted_inline != 'true'
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9  # v5
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          issue-number: ${{ env.PR_NUMBER }}
          body-path: guardian_report.md
