name: Guardian Review

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  review:
    # job-level if: uses GitHub expression engine, not shell — safe for comment.body comparison
    if: |
      github.event.issue.pull_request != null &&
      github.event.comment.body == '/guardian review'
    runs-on: ubuntu-latest
    # Below the app token's one-hour lifetime (#734): a review cannot outlive
    # the token it posts with.
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Check commenter has write access
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7
        with:
          script: |
            const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.payload.comment.user.login,
            });
            const allowed = ['admin', 'write'];
            if (!allowed.includes(perm.permission)) {
              core.setFailed(`@${context.payload.comment.user.login} needs write access to trigger Guardian Review (has: ${perm.permission})`);
            }

      - name: React to trigger comment
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          gh api repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions \
            -X POST -f content=eyes

      - name: Validate PR number and get base branch
        env:
          PR_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Invalid PR number: $PR_NUMBER" && exit 1
          fi
          echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_ENV
          BASE_BRANCH=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json baseRefName --jq '.baseRefName')
          echo "BASE_BRANCH=$BASE_BRANCH" >> $GITHUB_ENV

      # The PR is data, never code (#730). Everything that runs — uv sync, the
      # guardian scripts, cgis itself — comes from the default branch checked
      # out here; the PR lands in pr/ and is only diffed, read and parsed.
      # This step and the next keep the job's provider keys out of reach of
      # whoever wrote the PR.
      - name: Checkout trusted tooling (default branch)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Checkout PR branch as data
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          # PR_NUMBER validated as digits-only in previous step
          ref: refs/pull/${{ env.PR_NUMBER }}/head
          path: pr
          fetch-depth: 0
          persist-credentials: false

      # Anonymous, like the checkout above it: fine for this public repository.
      # A copy of this job for a private one must pass a token here, or the
      # fetch fails the job.
      - name: Fetch base branch for diff
        working-directory: pr
        run: git fetch origin "$BASE_BRANCH"

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39  # v3

      - name: Install dependencies
        run: uv sync --frozen --extra guardian

      # diff_check (#733) reads data keys, which the graph has only when
      # ingested with --data-keys; without the feature the graph is as before.
      - name: Build code graph
        env:
          GUARDIAN_FEATURES: ${{ vars.GUARDIAN_FEATURES }}
        run: |
          flags=""
          case ",${GUARDIAN_FEATURES// /}," in *,diff_check,*) flags="--data-keys" ;; esac
          uv run --frozen cgis ingest pr/src --output graph.db $flags

      # Fetches anonymously: the root checkout keeps no credentials (#730).
      # Fine while this repository is public; on a private one this restore
      # fails into `|| true` and save-metrics would overwrite the history.
      - name: Restore metrics from data branch
        run: |
          git fetch origin data/guardian-metrics 2>/dev/null && \
            git show origin/data/guardian-metrics:guardian_metrics.jsonl \
              > guardian_metrics.jsonl 2>/dev/null || true

      # Post as the codegraph-brain GitHub App when it is configured (#734):
      # set vars.GUARDIAN_APP_CLIENT_ID and secrets.GUARDIAN_APP_PRIVATE_KEY.
      # With the variable unset this step is skipped and posting uses
      # GITHUB_TOKEN, as before. With it set, a missing key, a wrong key or an
      # app not installed here fails the job before any LLM call: no silent
      # fallback to another identity. The app's key reaches every repository
      # the app is installed on, so the token is narrowed to this one and to
      # pull-requests: write, and only the two posting steps read it. It lives
      # one hour; the job's timeout-minutes keeps the review inside that.
      - name: Mint GitHub App token
        id: app-token
        if: vars.GUARDIAN_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.GUARDIAN_APP_CLIENT_ID }}
          private-key: ${{ secrets.GUARDIAN_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write

      - name: Run Guardian Review
        id: guardian
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GUARDIAN_PROVIDER: ${{ vars.GUARDIAN_PROVIDER }}
          GUARDIAN_MODEL: ${{ vars.GUARDIAN_MODEL }}
          # Thinking depth for an anthropic finder or skeptic; unset = the
          # provider's default ("low"). #246 J measured the finder at "medium".
          GUARDIAN_ANTHROPIC_EFFORT: ${{ vars.GUARDIAN_ANTHROPIC_EFFORT }}
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GUARDIAN_FEATURES: ${{ vars.GUARDIAN_FEATURES }}
          GUARDIAN_SKEPTIC: ${{ vars.GUARDIAN_SKEPTIC }}
          GUARDIAN_SKEPTIC_MODEL: ${{ vars.GUARDIAN_SKEPTIC_MODEL }}
          # GUARDIAN_EVIDENCE (#401) is deliberately not passed: the evidence
          # pass runs `uv run mypy/ruff` inside the reviewed checkout, which is
          # the PR, while this step holds the provider keys (#730).
          # guardian_review.py refuses that combination with --repo-root.
        run: |
          uv run --frozen python scripts/guardian_review.py \
            --output guardian_report.md \
            --db graph.db \
            --pr "$PR_NUMBER" \
            --metrics guardian_metrics.jsonl \
            --record-finder guardian_finder.json \
            --inline \
            --repo-root pr \
            --base-branch "$BASE_BRANCH"

      - name: Upload metrics artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: guardian-metrics-${{ env.PR_NUMBER }}
          path: guardian_metrics.jsonl
          retention-days: 7

      - name: Upload finder recording artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: guardian-finder-${{ env.PR_NUMBER }}
          path: guardian_finder.json
          retention-days: 7

      - name: Post review as PR comment
        if: steps.guardian.outputs.posted_inline != 'true'
        uses: peter-evans/create-or-update-comment@a111a2c3bacd7be7898ee22d0d71d9aec2bb972c  # v4
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          issue-number: ${{ env.PR_NUMBER }}
          body-path: guardian_report.md

  save-metrics:
    needs: review
    runs-on: ubuntu-latest
    # contents: write is scoped to this job only — no PR code runs here
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download metrics artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: guardian-metrics-${{ github.event.issue.number }}

      - name: Push metrics to data branch
        env:
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin data/guardian-metrics > /dev/null 2>&1; then
            git worktree add /tmp/metrics origin/data/guardian-metrics
          else
            git worktree add --orphan -b data/guardian-metrics /tmp/metrics
          fi
          cp guardian_metrics.jsonl /tmp/metrics/
          git -C /tmp/metrics add guardian_metrics.jsonl
          git -C /tmp/metrics diff --cached --quiet || \
            git -C /tmp/metrics commit -m "metrics: guardian review PR #${PR_NUMBER} [skip ci]"
          git -C /tmp/metrics push origin HEAD:data/guardian-metrics

  rate:
    # Triggered by: /guardian rate <applied> in a PR comment
    # Example: /guardian rate 2
    if: |
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/guardian rate ')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read

    steps:
      - name: Check commenter has write access
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7
        with:
          script: |
            const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.payload.comment.user.login,
            });
            const allowed = ['admin', 'write'];
            if (!allowed.includes(perm.permission)) {
              core.setFailed(`@${context.payload.comment.user.login} needs write access (has: ${perm.permission})`);
            }

      - name: Parse rate command
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Invalid PR number: $PR_NUMBER" && exit 1
          fi
          APPLIED=$(echo "$COMMENT_BODY" | sed -n 's|^/guardian rate \([0-9]*\).*|\1|p')
          if ! [[ "$APPLIED" =~ ^[0-9]+$ ]]; then
            echo "Invalid applied count in comment: '$COMMENT_BODY'" && exit 1
          fi
          echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_ENV
          echo "APPLIED=$APPLIED" >> $GITHUB_ENV

      - name: Checkout main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39  # v3

      - name: Install dependencies
        run: uv sync --frozen

      - name: Rate review and push metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin data/guardian-metrics
          git show origin/data/guardian-metrics:guardian_metrics.jsonl \
            > guardian_metrics.jsonl

          uv run --frozen cgis guardian-rate "$PR_NUMBER" "$APPLIED" \
            --metrics guardian_metrics.jsonl

          if git ls-remote --exit-code origin data/guardian-metrics > /dev/null 2>&1; then
            git worktree add /tmp/metrics origin/data/guardian-metrics
          else
            git worktree add --orphan -b data/guardian-metrics /tmp/metrics
          fi
          cp guardian_metrics.jsonl /tmp/metrics/
          git -C /tmp/metrics add guardian_metrics.jsonl
          git -C /tmp/metrics diff --cached --quiet || \
            git -C /tmp/metrics commit \
              -m "metrics: rate PR #${PR_NUMBER} applied=${APPLIED} [skip ci]"
          git -C /tmp/metrics push origin HEAD:data/guardian-metrics
