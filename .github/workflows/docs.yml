name: Docs Generation

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/docs.yml'

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Astral 'uv'
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install CGIS
        run: |
          uv pip install -e .

      - name: Ingest Codebase
        run: |
          # Временная база данных живет только во время работы Runner'а
          uv run cgis ingest ./src --output temp_graph.db

      - name: Generate Mermaid graph
        run: |
          mkdir -p docs/architecture/diagrams
          uv run cgis trace "src.cgis.pipeline.IngestionPipeline.run" --depth 2 -f mermaid > docs/architecture/diagrams/pipeline_flow.mermaid

      - name: Inject Mermaid Graph into Root README
        run: |
          # Используем наш надежный и безопасный питоновский скрипт вместо хрупкого Perl
          uv run python scripts/inject_readme_graph.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add README.md docs/architecture/

          if ! git diff-index --quiet HEAD; then
            git commit -m "docs: auto-sync architecture diagrams [skip ci]"
            git push origin main
          fi
