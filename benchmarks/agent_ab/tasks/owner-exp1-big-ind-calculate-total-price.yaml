notes: 'Exp1 (docs/lab-notes/2026-10-15-exp1-radius-indirection.md), cell big-ind, files >=5.

  Gold: cgis closure + AST name closure, every difference adjudicated with file:line.

  Accepted favorites chain: list_favorites (favorites/routes.py:176 FavoritesServiceDep, :214 service.list_page)
  -> FavoritesService.list_page (service.py:292 self._hydrate) -> _hydrate (service.py:383 self.catalog_service.build_cards;
  catalog_service typed Any but injected as CatalogServiceDep in get_favorites_service service.py:562)
  -> CatalogService.build_cards -> _apply_prices -> _price_owner_group -> _price_group_from_templates
  -> self.pricing_service.calculate_total_price (catalog/service.py:189). Rejected vehicle.routes.get_vehicle:
  calls VehicleService.get_vehicle (vehicle/routes.py:61 -> vehicle/service.py:422-455), which reads templates
  but never prices; the name match is rider.routes.get_vehicle. All 16 cgis callers verified. Indirect:
  yes.

