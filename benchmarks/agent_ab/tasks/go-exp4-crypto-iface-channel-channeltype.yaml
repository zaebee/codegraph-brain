  and methods can end up calling it, directly or transitively? List every one, production code only: non-test code
  in this repository''s root module (not `*_test.go` files). Follow every chain up to its entry point (an exported
  API function, `main`, a function nothing else calls, or a function the code only passes as a value, such as a
  cobra `RunE` handler) and name every function or method on the way.

  '
