question: 'In this repository, the function `refresh_dispatch` in

  `src/cgis/pipeline/__init__.py` is about to change. Which code under `src/`

  (not tests, not scripts) can end up calling it, directly or transitively? Follow every

  chain up to its entry point (a CLI command, an MCP tool, or a function nothing else calls)

  and name every function or method on the way.

  '
gold:
  symbols:
  - auto_refresh._refresh
  - auto_refresh.refresh_if_stale
  - mcp_server.cgis_ingest
  - cli.ingest
  - IngestionPipeline.run
  files:
  - src/cgis/api/auto_refresh.py
  - src/cgis/api/mcp_server.py
  - src/cgis/cli.py
  - src/cgis/pipeline/__init__.py
  allowed_symbols:
  - pipeline.refresh_dispatch
