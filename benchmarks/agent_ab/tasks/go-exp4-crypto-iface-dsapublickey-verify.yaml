notes: 'exp4 cell iface (ssh.PublicKey), drawn by benchmarks/agent_ab/analysis/exp4/gold/draw.py (random.Random(4));
  no cgis input.

  Target ssh.dsaPublicKey.Verify at ssh/keys.go:697.

  Gold model (pre-registration, section Gold): go/ssa VTA static/go/defer calls; closures, $bound and $thunk folded
  into their function; promoted wrappers and synthetic package initialisers traversed, never symbols; in-module
  interface dispatch by CHA with every CHA-only edge adjudicated (adjudications-crypto.json); stdlib/third-party/anonymous
  interface dispatch by VTA only; a function-value reference is not walked: the referenced function is an entry
  point and the function taking the value is allowed, not required (amendment 2).

  Allowed referencers (1): knownhosts.New

  Platform: the required closure is identical under GOOS=linux and GOOS=darwin (GOARCH=amd64); gold is linux.

  Nested modules deleted from the worktree before both arms: argon2/_asm/, blake2b/_asm/AVX2/, blake2b/_asm/standard/,
  blake2s/_asm/, chacha20poly1305/_asm/, internal/poly1305/_asm/, salsa20/salsa/_asm/, x509roots/fallback/.

  Target''s direct callers: agent.Key.Verify@ssh/agent/client.go:280 (invoke); ssh.CertChecker.CheckCert@ssh/certs.go:467
  (invoke); ssh.Certificate.Verify@ssh/certs.go:616 (invoke); ssh.connection.serverAuthenticate@ssh/server.go:886
