notes: 'Exp1 (docs/lab-notes/2026-10-15-exp1-radius-indirection.md), cell small-ind, files 2.

  Gold: cgis closure + AST name closure, every difference adjudicated with file:line.

  chat/service.py:431 (_render), :979 (_counterparties); get_conversation/get_by_reservation -> _render
  :463/:473; list_conversations -> _counterparties :1135. Routes reach the service through the Depends-injected
  ChatServiceDep (service.py:1200): chat/routes.py:172 conversations, :203 conversation_by_reservation,
