  - ChatService._counterparties
  - ChatService._render
  - ChatService.get_by_reservation
  - ChatService.get_conversation
  - ChatService.list_conversations
  - chat.routes.conversation
  - chat.routes.conversation_by_reservation
  - chat.routes.conversations
  files:
  - ownima-backend/app/domains/chat/routes.py
