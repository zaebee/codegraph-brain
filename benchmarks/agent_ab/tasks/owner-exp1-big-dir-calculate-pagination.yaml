notes: 'Exp1 (docs/lab-notes/2026-10-15-exp1-radius-indirection.md), cell big-dir, files 9.

  Gold: cgis closure + AST name closure, every difference adjudicated with file:line.

  All 15 cgis callers call calculate_pagination directly (vehicles.py:250, users.py:129/452/528/599, riders.py:86/227/284,
  reservations.py:346, finances.py:481, chat.py:276, audit.py:57, activity.py:50/105/160). Route handlers
  have no in-code callers. ast_only get_recent_activity is a false positive: activity.py:209-210 calls
  metrics_service.get_recent_vehicle_activities / get_recent_reservation_activities (MetricsService methods),
  not the same-named route handlers; it never calls calculate_pagination. Depth-1 star, all direct.

