question: 'In this repository, the method `TypeResolver._first_top_level_arg` in

  `src/cgis/languages/python/_types.py` is about to change. Which code under `src/`

  (not tests, not scripts) can end up calling it, directly or transitively? Follow every

  chain up to its entry point (a CLI command, an MCP tool, or a function nothing else calls)

  and name every function or method on the way.

  '
