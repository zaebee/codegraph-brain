notes: 'Exp1 (docs/lab-notes/2026-10-15-exp1-radius-indirection.md), cell big x indirect.

  Gold: cgis closure + AST name closure, every difference adjudicated with file:line.

  Accepted all 6. confirmation_batch.advance_owned -> reservation_service.advance_confirmation (confirmation_batch.py:62);
  ReservationService(ReservationCreation, ReservationTransitions) (reservation/service.py:58) inherits
  ReservationTransitions.advance_confirmation (transitions.py:209), the only def of that name. advance_each
  -> advance_owned (confirmation_batch.py:117). Routes via ReservationServiceDep (reservation/dependencies.py:40):
  confirmation_reservation -> advance_owned (routes.py:857), batch_confirmation_reservation -> advance_each
  (routes.py:916), force_confirmation_reservation -> force_confirmation (routes.py:954; transitions.py:573
  -> advance_confirmation), confirm_reservation -> create_confirmed_reservation (routes.py:421; creation.py:1025,
  cancel_conflicting_pending_reservations at creation.py:~1133 -> self.conflict_service.get_pending_conflicts_for_reservation
  core.py:283). All 16 cgis callers verified. GAP missed by BOTH cgis and AST: ReservationConflictService.check_conflicts
  passes self._check_conflicts_internal as a callable to self._execute_with_metrics (reservation_conflict_service.py:183-185),
  a reference, not a call. Every caller of check_conflicts therefore reaches the target too; see missed_by_both
  (the cgis closure from check_conflicts, a lower bound: callers cgis itself misses there, e.g. via injected
  conflict_service in creation.py:785, are not chased). Not folded into gold, per the gold definition.

  '
