notes: 'Exp1 (docs/lab-notes/2026-10-15-exp1-radius-indirection.md), cell big-ind, files 9.

  Gold: cgis closure + AST name closure, every difference adjudicated with file:line.

  Direct: lifecycle.py:260 (_open), :297 (_announce), :322 (_announce_and_close); _open_and_announce->_open
  :242; on_collected/on_completed/on_cancelled pass lambdas to _guarded :97/:104/:111; worker/reservations.py:268,:595
  call ChatLifecycle(session).on_cancelled. All 9 cgis valid. MISSED BY BOTH: (a) callback - on_confirmed
  passes bound self._open_and_announce to self._guarded :87-90, and _guarded invokes action(reservation)
  :157; (b) registry/getattr - reservation/effects.py:277 `await getattr(self.chat_lifecycle, hook)(reservation)`
  with hooks declared in reservation/machine.py Chat(''on_confirmed''|''on_collected''|''on_completed''|''on_cancelled'')
  :486-727; chat_lifecycle injected via ChatLifecycleDep (reservation/dependencies.py:25-36, core.py:156).
  From _run_effect: _apply_transition (graph) <- ReservationTransitions.{advance_confirmation,confirm_by_rider,cancel_reservation,collect_reservation,complete_reservation,mark_overdue},
  ReservationCreation.{create_pending,create_confirmed}_reservation, ReservationCore._cancel_reservation
  <- cancel_conflicting_pending_reservations (core.py:298) <- transitions.py:193 / creation.py:1133; force_confirmation->advance_confirmation
  transitions.py:573. Through ReservationServiceDep: reservation/routes.py:421,954,983,1009,1044,1136;
  confirmation_batch.py:63 advance_owned <- :113 advance_each; reservation/routes.py:857,916; rider/routes.py:1504
  (_book -> create_pending_reservation, then _booked_once/create_reservation/create_marketplace_reservation),
  :1927 (confirmation_reservation -> confirm_by_rider). rider/routes.py:1723 rider cancel goes to RiderService.cancel_reservation
  (rider/service.py:303), which does not use the machine - excluded. worker Worker._cancel_reservation
  (worker/reservations.py:178) is a different method. ast_only rejected: domains/ws/routes.py:152 `t.cancel()`
  is asyncio.Task.cancel, not Worker.cancel.

  Corrected after PR #633 review (C1): the CREATE_PENDING, CONFIRM_AS_RIDER and MARK_OVERDUE

  transitions carry no Chat(...) effect (reservation/machine.py:446-450, 643, 672), so their callers

  never reach _thread_for. 9 symbols and rider/routes.py were removed from gold.

  '
