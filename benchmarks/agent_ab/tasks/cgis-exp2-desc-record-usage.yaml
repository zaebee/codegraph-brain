notes: 'Exp2 (docs/lab-notes/2026-10-15-exp2-indirection-cgis.md), desc, pair 0, files 11, hop kinds [''direct'',
  ''callback'', ''polymorphic'', ''param_obj''].

  MISFITS DIRECT. cgis''s 12 are correct (gemini.py:57, mistral.py:103, ollama.py:162 _generate; openrouter.py:144
  _post; each provider''s generate_content/generate_structured -> self._generate/_post). Those last hops
  are callbacks: the call sits in a lambda thunk passed to self._retry (gemini.py:81/87, mistral.py:114/130,
  ollama.py:195/210, openrouter.py:183/198) and runs at base.py:128 `await call()`; BaseProvider._retry
  is therefore on the stack too (MISSED BY BOTH; it invokes the thunk, same file as the target). Upward
  the provider methods are reached only polymorphically through the abstract BaseProvider.generate_structured
  (base.py:154): core.py:63/72 finder_pass, skeptic.py:209 judge_finding, calibrate.py:163 judge_pair
  all call `provider.generate_structured` on a BaseProvider parameter. generate_content has no in-src
  caller (gemini.py:50 is the google SDK''s client method). All 16 ast_only are true callers: core.py:124
  _finder_pass, :129 run_review (direct), :136 judge_all; axes.py:48 _axis_pass, :77 guarded, :79/:119
  run_axis_review; calibrate.py:206 judge_matrix._one, :212 judge_matrix (no in-src caller); skeptic.py:269
  judge_all._one, :273 judge_all; chunked.py:108 _single_pass (reviewer.run_review, param_obj), :140/:154/:188
  run_chunked_review, :227/:238/:239 run_review_routed; runner.py:472 run_guardian. No FP.

  '
