# The language-neutral core of the cgis graph, one clause at a time.
#
# Each clause states one semantic rule every language pack implements. A conformance
# case (tests/fixtures/conformance/<lang>/<case>/expected.yml) cites the clause it
# checks, and tests/integration/test_conformance.py runs every case against every pack.
# Per-language facts a clause needs (which library functions invoke a value, say) live
# in the pack's profile (languages/<pack>/profile.py, data only), not here.
version: 1
clauses:
  CV-1:
    title: A function value handed to a known invoker is a call by whoever hands it over
    rule: >
      When function or method value F is passed, at a listed position or keyword name,
      to an invoker listed in the pack's profile (INVOKERS), the passing function P
      calls F. The invoker may run F now, later or not at all (an empty input, a second
      Once.Do), but every run it makes is on P's behalf, so for impact the caller is P.
      A direct `go f()` or `defer f()` is an ordinary call already; `go cb()` on a local
      is CV-2.
    edge: {type: CALLS, source: P, target: F, confidence: 1.0, context: "via <invoker>"}
    origin: "exp4 (#671): once.Do(c.handleForwards), time.AfterFunc(d, dr.renew); #668"
  CV-2:
    title: A function value called in the function that holds it is a call by that function
    rule: >
      When P binds function or method value F to a local (a variable, or the element
      variable of a range over a slice, array or map literal of values) and calls it
      inside P, P calls F. A reassignment in the declaring block replaces the value; one
      in a nested block (an if, a loop body) may not run, so after it the local holds
      either. A copy `x := cb` holds what cb holds.
    known_limits: >
      Go pilot: a call reads what the local holds at that point of a single pass, so a
      reassignment later in a loop body is not seen by a call earlier in it (a missed
      edge); a value held after one branch of an if is also seen in its else branch (an
      extra edge); a closure body is read where the closure is written, so it sees the
      value the local held then, not the one it holds when the closure runs (an extra
      edge and a missed one, for CV-1 arguments and CV-2 calls alike).
    edge: {type: CALLS, source: P, target: F, confidence: 1.0, context: "via local value"}
    origin: "exp4 pilot: Session.start's []F{(*Session).stdin, ...} loop; #668"
  CV-3:
    title: A function value given to other code to keep is not a call
    rule: >
      When F is stored where code outside P decides whether and when to call it (a struct
      field such as cobra's RunE, a handler registry, a hook), P does not call F. F is an
      entry point, like a function nothing calls.
    edge: none
    origin: "exp4 amendment 2"
  CV-4:
    title: A function value handed to a function that calls that parameter is a call by whoever hands it over
    rule: >
      When function or method I in the graph calls its own parameter p in its own body
      (not in a nested function or lambda), and no assignment to p comes before that
      call, I is an invoker of p, by p's position and by p's name. When P passes
      function or method value F there, P calls F. The edge never starts at I, which
      would make every caller of I reach every value handed to it. A method's positions
      count after its first parameter unless it is a staticmethod; a keyword-only
      parameter is invoked by name only, a positional-only one by position only.
    known_limits: >
      Python: one level only (a parameter passed on, `pool.submit(fn)`, makes no
      invoker); a method called through its class shifts positions by one; an argument
      after a `*xs` splat has no position; a default value of p gets no edge.
    edge: {type: CALLS, source: P, target: F, confidence: 1.0, context: "via <I>"}
    origin: "exp1 (#632): self._execute_with_metrics(..., self._check_conflicts_internal)"
  DK-1:
    title: Code that stores a value under a key writes that key
    rule: >
      A key is a string literal in a key position, normalised to a dotted path
      (`details.brand`). When code stores a value under a key (`d["k"] = v`,
      `d.setdefault("k", ...)`, a dict literal handed to a write call, nested keys as
      dotted paths), the enclosing function writes the key. Keys are compared inside a
      namespace (an index, a Redis prefix, a task registry, a model class), empty for
      an unscoped key; a namespace is given only where the call site names it (an
      argument, or a module-level constant). The key is one virtual DATA_KEY node per
      (namespace, path) across the repository.
    edge: {type: WRITES_KEY, source: P, target: "key:<namespace>|<path>", confidence: 1.0}
    origin: "data-key layer spec (2026-10-18), Concepts"
  DK-2:
    title: Code that reads a value by key reads that key
    rule: >
      When code reads a value by a key (`d["k"]`, `d.get("k")`, `d.pop("k")`,
      `"k" in d`, a dict literal inside a query body, path from the inner key), the
      enclosing function reads the key. The edge targets the same DATA_KEY node as
      DK-1; `d.pop("k")` both reads and writes it. Two keys name the same data when
      their paths are equal and their namespaces are equal or either is unscoped.
    edge: {type: READS_KEY, source: P, target: "key:<namespace>|<path>", confidence: 1.0}
    origin: "data-key layer spec (2026-10-18), Concepts"
  DK-3:
    title: A model field or a declaring file declares its key
    rule: >
      A field of a model class (pydantic, dataclass) or an entry of a declaring file
      declares a key whose namespace is the model. The declaring class or file node
      has a DECLARES_KEY edge to the key. Declaring is neither reading nor writing: a
      key with a declaration and no reader is a dead field, one with a reader and no
      declaration is undeclared.
    edge: {type: DECLARES_KEY, source: C, target: "key:<namespace>|<path>", confidence: 1.0}
    origin: "data-key layer spec (2026-10-18), Concepts"
